changelog:
  - 2026-10-29: catalogue registered (72 factors). No tier changes yet.
  - 2026-10-29 (post-mortem): D14 amendment registered, not yet tested — add a stand-in QUALITY modifier (former tier-1 starter / recent pro vs academy or unknown); TES's 369 case showed the sign can flip. D8 note — media 'lighter workload' talk without a depth-chart change is weak evidence (Jacobs 21 carries). Watch tier now requires UPS >= 3 (CFO case).
  - 2026-10-30 (night): registered for testing — (1) D5/D10 timing: a star ruled out inside ~3h of tip is under-adjusted (DAL/Sengun case: Pinnacle +2pp, dog won); (2) D8 team-level: a star's first game back hurts the TEAM result even when his box score is fine (LAL/Luka case); (3) prop modelling: weight a 5+ game current-season dip with a mechanism at >= 50/50 vs last season (Jokić case).
