# Upsets track — pre-registered hypothesis catalogue
# Source: "Upsets and Unlikely Outcomes" study (2026-10-29). Tiers: D documented,
# S strong evidence, M mixed, P plausible/untested, F forum theory, X contradicted.
# effect: prior guess in probability points (pp) or spread points (pts); replaced by data.
# priced: how much the market already prices it (H/Med/L). A priced factor is still logged.
# Status moves only by a dated note in CHANGELOG below, after an out-of-sample test.
version: 2026-10-29
